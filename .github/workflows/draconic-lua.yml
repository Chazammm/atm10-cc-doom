name: Draconic Lua check

on:
  push:
    paths:
      - 'draconic-monitor/**'
      - '.github/workflows/draconic-lua.yml'
  pull_request:
    paths:
      - 'draconic-monitor/**'
      - '.github/workflows/draconic-lua.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Syntax check
        run: luac5.3 -p draconic-monitor/draconic.lua && luac5.3 -p draconic-monitor/tests/smoke.lua
      - name: Mocked CC:Tweaked scan and selftest
        run: lua5.3 draconic-monitor/tests/smoke.lua
